name: Windows installer verification

on:
  push:
    branches:
      - 'codex/windows-updater-*'
  workflow_dispatch:
    inputs:
      restart_only:
        description: Run isolated Windows restart checks without rebuilding installers
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-installer-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restart-fixtures:
    name: Verify isolated desktop restart behavior
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Check production Windows PowerShell helpers
        shell: powershell
        run: ./scripts/test_windows_desktop_restart.ps1
      - name: Check PowerShell 7 compatibility
        shell: pwsh
        run: ./scripts/test_windows_desktop_restart.ps1

  windows-installer:
    name: Verify Windows update migration
    needs: restart-fixtures
    if: ${{ !inputs.restart_only }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.26.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop typecheck
      - run: node --test apps/desktop/tests/*.test.mjs
      - name: Test native WSL SQLite snapshots with active WAL fixtures
        run: python scripts/test_wsl_session_snapshot.py
      - name: Verify SDK TLS fixture tooling
        run: |
          $openssl = Get-Command openssl -ErrorAction Stop
          & $openssl.Source version
      - name: Run Windows release tests
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'codexx-test-artifacts.json'
          cargo test --release --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked --no-run --message-format=json > $artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $harness = ./scripts/ensure-test-common-controls.ps1 -CargoJson $artifacts -OutputDirectory $env:RUNNER_TEMP | ConvertFrom-Json
          Write-Host "Running all tests in $($harness.testExecutable)"
          $env:PATH = "$(Split-Path -Parent $harness.testExecutable);$env:PATH"
          Push-Location apps/desktop/src-tauri
          try {
            & $harness.testExecutable --test-threads=1
            $testExitCode = $LASTEXITCODE
          } finally { Pop-Location }
          if ($testExitCode -ne 0) { exit $testExitCode }
      - name: Diagnose failed Windows test loader
        if: failure()
        run: ./scripts/windows-dll-diagnostics.ps1 -RunHarnessList
      - name: Retain Windows loader diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-loader-diagnostics
          path: ${{ runner.temp }}/codexx-dll-diagnostics
          retention-days: 7
          if-no-files-found: warn
      - name: Build test installer without publishing or release signing credentials
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\installer-check.json" -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm --dir apps/desktop tauri build --bundles msi --config "$env:RUNNER_TEMP\installer-check.json" --ci
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - name: Retain Windows candidate for local validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/codex-x.exe
            THIRD_PARTY_NOTICES.md
          retention-days: 7
          if-no-files-found: error

      - name: Test MSI installation, upgrade, and application launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi -Filter '*.msi')
          if ($installers.Count -ne 1) { throw 'Expected one MSI installer.' }
          ./scripts/windows-msi-install-smoke.ps1 -Installer $installers[0].FullName
