name: Verify published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify, for example v0.3.31
        required: true
        type: string
      use_current_verifier:
        description: Use current checks for explicitly revised release metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify published updater downloads
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?", os.environ["RELEASE_TAG"]):
              raise SystemExit("Invalid release tag")
          PY

      - name: Checkout selected verification rules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.use_current_verifier && github.sha || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      - name: Verify manifest and complete asset downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/verify_published_release.py

      - name: Retain independent verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-release-verification-${{ inputs.tag }}
          path: published-release-verification/
          if-no-files-found: error
          retention-days: 14
