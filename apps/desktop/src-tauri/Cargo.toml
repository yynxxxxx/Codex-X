[package]
name = "codex-x"
version = "0.3.33"
description = "Codex Switch & Instruct desktop manager"
authors = ["yynxxxxx"]
license = "MIT"
edition = "2021"
rust-version = "1.89.0"

[lib]
name = "codexx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = ["tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
base64 = "0.22"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
thiserror = "2.0"
rusqlite = { version = "0.31", features = ["backup", "bundled"] }
semver = "1.0"
ureq = { version = "2.12", features = ["tls"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
    "socks",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
percent-encoding = "2.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "=2.4.3"
httparse = "1"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
flate2 = "1"
zstd = "0.13"
tempfile = "3.27"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
tauri = { version = "2.8.2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
